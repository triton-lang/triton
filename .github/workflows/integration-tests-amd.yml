name: Integration Tests AMD

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

jobs:
  integration-tests-amd:
    name: integration-tests-amd (${{ join(matrix.runner, ', ') }}${{ matrix.image_variant != 'default' && format(', {0}', matrix.image_variant) || '' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      matrix:
        runner: ${{ fromJson(inputs.matrix) }}
        image_variant: ["default"]
        include:
          - image: rocm/pytorch:rocm7.0_ubuntu22.04_py3.10_pytorch_release_2.8.0
            runner: ["self-hosted", "gfx90a"]
            # Cache save/restore is on the host machine at directory /home/runner/.triton, while in the docker
            # container expect it at /github/home/.triton. So map here to make sure visible in docker.
            options: >-
              --device=/dev/kfd --device=/dev/dri --security-opt seccomp=unconfined --group-add video --user root
              --volume /home/runner/.triton:/github/home/.triton
          - image: rocm/pytorch:rocm7.2.4_ubuntu22.04_py3.10_pytorch_release_2.10.0
            runner: ["amd-gfx942"]
            # We add --env-file to pull in HIP_VISIBLE_DEVICES and ROCR_VISIBLE_DEVICES definition for GPU isolation.
            options: >-
              --device=/dev/kfd --device=/dev/dri --security-opt seccomp=unconfined --group-add video --user root
              --env-file /etc/podinfo/gha-gpu-isolation-settings
              --volume /home/runner/.triton:/github/home/.triton
          - image: rocm/pytorch:rocm7.2.4_ubuntu22.04_py3.10_pytorch_release_2.10.0
            runner: ["amd-gfx950"]
            # We add --env-file to pull in HIP_VISIBLE_DEVICES and ROCR_VISIBLE_DEVICES definition for GPU isolation.
            options: >-
              --device=/dev/kfd --device=/dev/dri --security-opt seccomp=unconfined --group-add video --user root
              --env-file /etc/podinfo/gha-gpu-isolation-settings
              --volume /home/runner/.triton:/github/home/.triton
              --volume /triton-data:/triton-data
          - image: tritonci/triton-amd-ci:rocm10.1.0a20260820-pytorch2.15.0a0-gfx942-gfx950-gfx1250-r1
            runner: ["amd-gfx950"]
            image_variant: "rocm10.1"
            # We add --env-file to pull in HIP_VISIBLE_DEVICES and ROCR_VISIBLE_DEVICES definition for GPU isolation.
            options: >-
              --device=/dev/kfd --device=/dev/dri --security-opt seccomp=unconfined --group-add video --user root
              --env-file /etc/podinfo/gha-gpu-isolation-settings
              --volume /home/runner/.triton:/github/home/.triton
              --volume /triton-data:/triton-data
    env:
      RUNNER_TYPE: ${{ matrix.runner[1] }}
      WARMUP_MAX_PROCS: "96"
      TRITON_BUILD_WITH_CCACHE: "true"
      TRITON_BUILD_WITH_CLANG_LLD: "TRUE"
      TRITON_USE_ASSERT_ENABLED_LLVM: "TRUE"
      TRITON_DISABLE_LINE_INFO: 1
      PROTON_SKIP_PC_SAMPLING_TEST: ${{ matrix.image_variant == 'rocm10.1' && '0' || '1' }}
      PROTON_SKIP_CUDAGRAPH_TEST: 1
      PYTHON: "python3"
      PYTEST_ADDOPTS: "-p triton._compile_warmup"
      CCACHE_COMPRESS: "true"
      PIP_BREAK_SYSTEM_PACKAGES: 1
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.options }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Inspect AMD runner
        env:
          CI_CONTAINER_IMAGE: ${{ matrix.image }}
          CI_RUNNER_LABELS: ${{ join(matrix.runner, ', ') }}
        run: bash .github/amd-ci/runner-diagnostics.sh
        shell: bash
      - name: Compute cache keys
        id: cache-key
        run: |
          llvm_file="cmake/llvm-info.json"
          nvidia_file="cmake/nvidia-toolchain-version.json"
          amd_file="cmake/amd-llvm-info.json"
          json_file="cmake/json-version.txt"

          # Check if files exist before proceeding
          if [[ ! -f "$llvm_file" || ! -f "$nvidia_file" || ! -f "$amd_file" || ! -f "$json_file" ]]; then
            echo "Error: Required dependency files are missing."
            exit 1
          fi

          # Process the files if they exist
          echo "llvm=$(sha256sum $llvm_file | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          echo "nvidia=$(sha256sum $nvidia_file | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          echo "amd=$(sha256sum $amd_file | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT
          echo "json=$(cat $json_file)" >> $GITHUB_OUTPUT
        shell: bash
      - name: Restore build dependencies cache
        id: restore-build-deps-cache
        if: ${{ !contains(matrix.runner, 'gfx90a') }}
        uses: actions/cache/restore@v6
        with:
          # Note that we cannot use environment variables here given there is
          # no shell to interpret them in the paths.
          path: |
            ~/.triton/llvm
            ~/.triton/nvidia
            ~/.triton/amd
            ~/.triton/json
          key: ${{ runner.os }}-${{ runner.arch }}-llvm-${{ steps.cache-key.outputs.llvm }}-nvidia-${{ steps.cache-key.outputs.nvidia }}-amd-${{ steps.cache-key.outputs.amd }}-json-${{ steps.cache-key.outputs.json }}
      - name: Install dependencies
        run: apt-get update && apt-get install -y clang lld ccache
      - name: Inspect cache directories
        run: |
          mkdir -p ~/.triton
          du -h -d 1 ~/.triton

          mkdir -p ~/.ccache
          du -h -d 1 ~/.ccache
      - name: Update compiler to Clang
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
      - name: Install Triton
        id: amd-install-triton
        run: |
          echo "PATH is '$PATH'"
          pip uninstall -y triton pytorch-triton-rocm

          ccache --zero-stats
          if ${{ contains(matrix.runner, 'amd-gfx950') }}; then
            pip install --cache-dir /triton-data/pip-cache -r python/requirements.txt
            pip install --cache-dir /triton-data/pip-cache -r python/test-requirements.txt
          fi
          make dev-install
      - name: Print ccache stats
        run: ccache --print-stats
      - name: Run lit tests
        run: make test-lit
      - name: Run C++ unittests
        run: make test-cpp
      - name: Warm Triton compile cache
        shell: bash
        run: |
          trace_dir="$RUNNER_TEMP/triton-ci-compile-trace"
          rm -rf "$trace_dir"
          echo "TRITON_CI_COMPILE_TRACE_DIR=$trace_dir" >> "$GITHUB_ENV"
          export TRITON_CI_COMPILE_TRACE_DIR="$trace_dir"
          warmup_procs=$(nproc)
          if (( warmup_procs > WARMUP_MAX_PROCS )); then
            warmup_procs=$WARMUP_MAX_PROCS
          fi
          warmup_targets=(
            python/test/unit/language
            python/test/gluon
            python/tutorials/06-fused-attention.py
            python/test/regression
          )
          if ${{ contains(matrix.runner, 'amd-gfx950') || contains(matrix.runner, 'amd-gfx942') }}; then
            warmup_targets+=(python/triton_kernels/tests)
          fi
          python3 -m triton._test_runner warmup --warmup-procs "$warmup_procs" "${warmup_targets[@]}"
      - name: Run Python tests on AMD
        run: |
          INSTRUMENTATION_LIB_DIR="${GITHUB_WORKSPACE}/python/triton/instrumentation"
          if [ ! -d "${INSTRUMENTATION_LIB_DIR}" ]; then
            echo "Could not find '${INSTRUMENTATION_LIB_DIR}'" ; exit -1
          fi

          # Install hip-python
          pip install -i https://test.pypi.org/simple/ hip-python

          # Test gluon
          TRITON_CI_CACHE_PHASE=gluon pytest --capture=tee-sys -rfs -n 8 python/test/gluon/

          TRITON_CI_CACHE_PHASE=attention pytest --capture=tee-sys -rfs python/tutorials/06-fused-attention.py
          pytest --capture=tee-sys -rfs -n 8 third_party/amd/python/test/ \
                --ignore=third_party/amd/python/test/test_scalarize_packed_fops.py \
                --ignore=third_party/amd/python/test/test_address_sanitizer.py \
                --ignore=third_party/amd/python/test/test_gluon_cdna5.py
          pytest --capture=tee-sys -rfs -n 8 third_party/amd/python/test/test_gluon_cdna5.py -k "test_compile"
          TRITON_ALWAYS_COMPILE=1 pytest --capture=tee-sys -rfs third_party/amd/python/test/test_scalarize_packed_fops.py
          cd python/test/unit
          TRITON_CI_CACHE_PHASE=unit pytest --capture=tee-sys -rfs -n 12 \
                 --ignore=blackwell \
                 --ignore=cuda \
                 --ignore=instrumentation \
                 --ignore=language/test_line_info.py \
                 --ignore=test_debug.py
          # TODO: uncomment
          # pytest --capture=tee-sys -rfs test_debug.py
          TRITON_ALWAYS_COMPILE=1 TRITON_DISABLE_LINE_INFO=0 LLVM_PASS_PLUGIN_PATH=${INSTRUMENTATION_LIB_DIR}/libGPUInstrumentationTestLib.so \
          env -u HIP_VISIBLE_DEVICES pytest --capture=tee-sys -rfs -vvv instrumentation/test_gpuhello.py

          # Run test_tensor_atomic_cas with buffer ops disabled on gfx950 and gfx942
          if ${{ contains(matrix.runner, 'amd-gfx950') || contains(matrix.runner, 'amd-gfx942') }}; then
            AMDGCN_USE_BUFFER_OPS=0 pytest --capture=tee-sys -rfs -n 12 language/test_core.py::test_tensor_atomic_cas
          fi

          # Run test_line_info.py separately with TRITON_DISABLE_LINE_INFO=0
          if ${{ contains(matrix.runner, 'amd-gfx950') }}; then
            TRITON_DISABLE_LINE_INFO=0 python3 -m pytest -s -n 8 language/test_line_info.py -k "not test_line_info_ir_source"
          else
            TRITON_DISABLE_LINE_INFO=0 python3 -m pytest -s -n 8 language/test_line_info.py
          fi

          # Run tests under triton/python/triton_kernels/tests/ on gfx950 and gfx942
          if ${{ contains(matrix.runner, 'amd-gfx950') || contains(matrix.runner, 'amd-gfx942') }}; then
            cd ../../triton_kernels/
            TRITON_CI_CACHE_PHASE=triton-kernels python3 -m pytest -s -n 10 tests/
          fi
      - name: Run asan tests on AMD
        if: false
        run: |
          cd third_party/amd/python/test/
          ulimit -s 1024
          export PATH=$(find ~/.triton/llvm -name llvm-symbolizer  -printf '%h\n'):$PATH
          TORCH_PATH=$(find /opt -name libcaffe2_nvrtc.so -printf '%h\n')
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$TORCH_PATH
          mv $TORCH_PATH/libamdhip64.so $TORCH_PATH/libamdhip64_bck.so
          export LD_LIBRARY_PATH=$(find /opt -name libclang_rt.asan-x86_64.so -printf '%h\n'):$LD_LIBRARY_PATH
          export LD_LIBRARY_PATH=$(find /opt -type d -wholename *lib/llvm/lib/asan):$LD_LIBRARY_PATH
          export LD_LIBRARY_PATH=$(find /opt -wholename *lib/asan/libamdhip64.so -printf '%h\n'):$LD_LIBRARY_PATH
          export CLANG_ASAN_LIB=$(find /opt -name libclang_rt.asan-x86_64.so)
          export HIP_ASAN_LIB=$(find /opt -wholename *lib/asan/libamdhip64.so)
          ASAN_OPTIONS=detect_leaks=0,alloc_dealloc_mismatch=0 \
          LD_PRELOAD=$CLANG_ASAN_LIB:$HIP_ASAN_LIB python3 -m pytest -s test_address_sanitizer.py
          mv $TORCH_PATH/libamdhip64_bck.so $TORCH_PATH/libamdhip64.so
      - name: Run regression tests
        run: |
          make test-regression
      - name: Verify compile warmup completeness
        run: python3 -m triton._test_runner report --require-complete
      - name: Run microbenchmark tests
        run: |
          python3 python/test/microbenchmark/launch_overhead.py
      - name: Run Proton tests
        run: |
          unset HIP_VISIBLE_DEVICES
          TRITON_DISABLE_LINE_INFO=0 make test-proton
      - name: Inspect cache directories
        run: |
          mkdir -p ~/.triton
          du -h -d 1 ~/.triton

          mkdir -p ~/.ccache
          du -h -d 1 ~/.ccache
      - name: Save build dependencies cache
        if: ${{ github.ref == 'refs/heads/main' && !contains(matrix.runner, 'gfx90a') }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.triton/llvm
            ~/.triton/nvidia
            ~/.triton/amd
            ~/.triton/json
          key: ${{ steps.restore-build-deps-cache.outputs.cache-primary-key }}
      - name: Clean up caches
        # Always cleanup the worker, even if builds or tests failed given that these directories are
        # mapped from the host and we write files as the root user in the docker.
        if: always()
        run: |
          rm -rf ~/.triton/cache
          rm -rf ~/.ccache

  integration-tests-amd-rocjitsu:
    name: integration-tests-amd (gfx1250-rocjitsu)
    if: github.repository == 'triton-lang/triton'
    runs-on: amd-gfx942
    timeout-minutes: 60
    env:
      TRITON_BUILD_WITH_CCACHE: "true"
      TRITON_BUILD_WITH_CLANG_LLD: "TRUE"
      TRITON_USE_ASSERT_ENABLED_LLVM: "TRUE"
      TRITON_DISABLE_LINE_INFO: 1
      PYTHON: "python3"
      PYTEST_ADDOPTS: "-p triton._compile_warmup"
      CCACHE_COMPRESS: "true"
      PIP_BREAK_SYSTEM_PACKAGES: 1
      ROCM_NIGHTLY_INDEX_URL: https://nightly.repo.amd.com/rocm/whl-next/
      ROCM_VERSION: "10.2.0a20260921"
      TORCH_VERSION: "2.15.0a0+rocm10.2.0a20260921"
    container:
      image: tritonci/triton-amd-ci:rocm10.1.0a20260820-pytorch2.15.0a0-gfx942-gfx950-gfx1250-r1
      options: >-
        --security-opt seccomp=unconfined --user root
        --volume /home/runner/.triton:/github/home/.triton
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Setup gfx1250 emulation
        shell: bash
        run: |
          set -xeo pipefail
          unset HIP_VISIBLE_DEVICES ROCR_VISIBLE_DEVICES CUDA_VISIBLE_DEVICES
          python3 -m pip uninstall -y \
            triton triton-rocm pytorch-triton torch amd-torch-device-gfx1250 \
            rocm rocm-sdk-core rocm-sdk-devel rocm-sdk-libraries rocm-sdk-device-gfx1250 \
            2>/dev/null || true
          python3 -m pip install --pre --force-reinstall \
            --index-url "${ROCM_NIGHTLY_INDEX_URL}" \
            --extra-index-url https://pypi.org/simple \
            "rocm[libraries,devel,device-gfx1250]==${ROCM_VERSION}" \
            "torch[device-gfx1250]==${TORCH_VERSION}"
          rocm-sdk init
          ROCM_ROOT="$(rocm-sdk path --root)"
          echo "ROCM_ROOT=${ROCM_ROOT}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${ROCM_ROOT}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "${ROCM_ROOT}/bin" >> "$GITHUB_PATH"
          test -f "${ROCM_ROOT}/lib/libamdhip64.so"
          test -x "${ROCM_ROOT}/bin/mirage"
          config="${ROCM_ROOT}/share/rocjitsu/configs/gfx1250_mi455x.json"
          if [ ! -f "${config}" ]; then
            config="${ROCM_ROOT}/share/rocjitsu/configs/gfx1250.json"
          fi
          test -f "${config}"
          echo "ROCJITSU_CONFIG=${config}" >> "$GITHUB_ENV"
          echo "ROCJITSU=${ROCM_ROOT}/bin/mirage run --in-process --config ${config} --" >> "$GITHUB_ENV"
      - name: Install Triton
        shell: bash
        run: |
          pip uninstall -y triton pytorch-triton-rocm
          ccache --zero-stats
          pip install -r python/requirements.txt
          pip install -r python/test-requirements.txt pytest-timeout
          make dev-install
          pip install -e python/triton_kernels
      - name: Print ccache stats
        run: ccache --print-stats
      - name: Check active target is gfx1250
        shell: bash
        run: $ROCJITSU python3 -c "import triton; print(triton.runtime.driver.active.get_current_target())"
      - name: Run Gluon tests on gfx1250-rocjitsu
        shell: bash
        run: |
          set -euo pipefail
          $ROCJITSU pytest --capture=tee-sys -rfs -n 64 --durations=20 \
            third_party/amd/python/test/test_gluon_cdna5.py
          $ROCJITSU pytest --capture=tee-sys -rfs -n 16 --durations=20 \
            third_party/amd/python/test/test_tdm_copy.py
          $ROCJITSU pytest --capture=tee-sys -rfs -n 64 --durations=20 \
            python/test/gluon/test_frontend.py
          $ROCJITSU pytest --capture=tee-sys -rfs -n 64 --durations=20 \
            python/test/gluon/test_fpsan.py
          $ROCJITSU pytest --capture=tee-sys -rfs -n 64 --durations=20 \
            third_party/amd/python/examples/gluon/f16_gemm_cdna5.py
          $ROCJITSU pytest --capture=tee-sys -rfs -n 16 --durations=20 \
            third_party/amd/python/examples/gluon/f16_gemm_streamk_cdna5.py
          $ROCJITSU pytest --capture=tee-sys -rfs -n 16 --durations=20 \
            third_party/amd/python/examples/gluon/f16_fa_cdna5.py
          TRITON_DISABLE_LINE_INFO=0 $ROCJITSU pytest --capture=tee-sys -rfs -n 16 --durations=20 \
            third_party/amd/python/examples/gluon/mxfp_fa_cdna5.py
      - name: Run Triton tests on gfx1250-rocjitsu
        shell: bash
        run: |
          set -euo pipefail
          k_runtime="not (test_device_assert or test_expect_zero_device_assert or test_sanitize_int or test_replenishing_process_pool_reuses_clean_processes or test_run_in_process_handles_large_exceptions)"
          k_core="not (test_load_store_same_ptr or test_atomic_cas or (test_scan2d and shape365) or (test_scan2d and shape869) or (test_umulhi and int64) or (test_umulhi and uint64) or (test_scaled_dot and e2m1-e4m3))"
          k_matmul="not (test_preshuffle_scale_mxfp_cdna4 or test_batched_mxfp or test_mxfp8_mxfp4_matmul or test_block_scale_fp4 or (test_simple_matmul and float64-float64))"
          k_tdesc="not (tensor_descriptor_reduce or test_tensor_descriptor_padding or test_host_tensor_descriptor_round_f32_to_tf32)"

          k_all="$k_runtime and $k_core and $k_matmul and $k_tdesc"

          $ROCJITSU pytest --capture=tee-sys -rfs -n 64 --durations=20 -k "$k_all" -p no:forked \
            --timeout=600 --timeout-method=thread \
            python/test/unit/test_debug.py \
            python/test/unit/runtime \
            python/test/unit/language/test_core.py \
            python/test/unit/language/test_matmul.py \
            python/test/unit/language/test_tensor_descriptor.py \
            python/triton_kernels/tests/test_topk.py::test_topk
          $ROCJITSU pytest --capture=tee-sys -rfs -n 64 --durations=20 \
            third_party/amd/python/test/ \
            --ignore=third_party/amd/python/test/test_address_sanitizer.py \
            --ignore=third_party/amd/python/test/test_gluon_cdna5_consan.py \
            --ignore=third_party/amd/python/test/test_pointer_optimization.py \
            --ignore=third_party/amd/python/test/test_gluon_cdna5.py \
            --ignore=third_party/amd/python/test/test_tdm_copy.py \
            --ignore=third_party/amd/python/test/test_int8_dot_small_block_k.py
          $ROCJITSU pytest --capture=tee-sys -rfs -n 1 --durations=20 -p no:forked \
            --timeout=300 --timeout-method=thread \
            python/test/unit/language/test_pipeliner.py::test_scatter_pipeline
          moe_tests=(
            "test_op[None-False-False-True-True-None-128-768-512-1024-batched-float16-float16-None-10-1-False-False-False-False-None-False-False-False-True-None]"
            "test_op[None-False-True-False-True-None-128-16-256-256-ragged-float8_e5m2-mxfloat4_e2m1-None-10-1-False-True-False-False-None-False-False-False-True-None]"
            "test_op[None-False-True-False-True-None-128-300-400-832-ragged-float8_e5m2-mxfloat4_e2m1-None-10-1-False-False-False-False-None-False-False-False-True-None]"
            "test_op[None-False-False-False-False-None-16-727-577-859-ragged-float16-float16-None-10-1-False-False-False-False-None-False-False-False-True-None]"
          )
          moe_k_expr="$(printf '%s or ' "${moe_tests[@]}" | sed 's/ or $//')"
          HSA_ENABLE_SDMA=0 $ROCJITSU pytest --capture=tee-sys -rfs -n 4 --durations=20 \
            -k "$moe_k_expr" python/triton_kernels/tests/test_matmul.py
      - name: Clean up caches
        if: always()
        run: |
          rm -rf ~/.triton/cache
          rm -rf ~/.ccache
