name: Build and test
run-name: ${{ inputs.run_name }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      # You can name your branch dev-foo to get CI runs.
      - 'dev-**'
  push:
    branches:
      - main

env:
  python-version: '3.12'

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on:
      - glados
      - intel
      - x86
    steps:
      - name: Print inputs
        run: |
          echo "${{ toJSON(github.event.inputs) }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python ${{ env.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}

      - name: Run pre-commit checks
        run: |
          pip install --upgrade pre-commit

          # TODO: ignore the first yapf failure until https://github.com/google/yapf/issues/1164 is fixed
          python3 -m pre_commit run --all-files --verbose yapf &> /dev/null || true
          # If first run of yapf worked and made changes reset the tree to the original state
          git reset --hard

          python3 -m pre_commit run --show-diff-on-failure --color=always --all-files --verbose

  build-test:
    name: Build and test on ${{ matrix.config.runner }}
    runs-on: ${{ matrix.config.runs_on }}
    strategy:
      matrix:
        config:
          - {runner: 'Ubuntu Intel x86', runs_on: ['glados', 'intel', 'x86'], target-os: 'ubuntu', arch: 'x86'}
          - {runner: 'MacOS-latest ARM64', runs_on: ['macos-latest'], target-os: 'macos',  arch: 'arm64'}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python ${{ env.python-version }}
        id: install-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}

      - name: Install pip and apt dependencies
        env:
          RUNNER_TARGET_OS: ${{ matrix.config.target-os }}
        run: |
          echo "RUNNER_TARGET_OS: ${RUNNER_TARGET_OS}"
          python3 -m pip install --upgrade pip
          python3 -m pip install -r python/requirements.txt
          python3 -m pip install -r python/test-requirements.txt
          if [[ "${RUNNER_TARGET_OS}" == "ubuntu" ]]; then
            sudo apt-get update
            sudo apt-get install -y zlib1g-dev g++
          fi
          pip install torch matplotlib

      - name: Install Triton
        env:
          #macos-latest has 3 cores and 7gb ram, cap
          MAX_JOBS: ${{ matrix.config.target-os == 'macos' && '3' || '' }}
        run: |
          echo "PATH is '$PATH'"
          python3 -m pip install --no-build-isolation -vvv -e '.[tests]'

      - name: Run python unit tests for MacOS Arm64
        if: matrix.config.target-os == 'macos'
        run: |
          export CC=$(which clang)
          export TRITON_DISABLE_OPENMP=1 # temporary
          export TRITON_DEFAULT_BACKEND=cpu

          # Document some versions/flags
          echo "xcode-select:"; xcode-select -p
          echo "CC: ${CC}"
          clang --version
          echo "TRITON_DISABLE_OPENMP=${TRITON_DISABLE_OPENMP}"
          echo "TRITON_DEFAULT_BACKEND=${TRITON_DEFAULT_BACKEND}"

          # Run without xdist so the capability query result is visible in CI logs.
          python -m pytest -s --tb=short --device cpu \
            python/test/unit/cpu/test_cpu_features.py

          # Run BF16 dot tests separately below; keep the broad BF16
          # exclusions for the remaining macOS tests.
          python -m pytest -s -n 3 --device cpu \
            python/test/unit/language/test_core.py -k "not bfloat16"
          # Collect the full file for CPU allowlist validation, then select BF16
          # dot cases and run them through Triton's native CPU lowering.
          TRITON_CPU_UKERNELS_LIB=None python -m pytest -s --tb=short -n 3 --device cpu \
            python/test/unit/language/test_core.py -k "test_dot and bfloat16"
          python -m pytest -s -n 3 --device cpu \
            python/test/unit/cpu/test_math.py \
            python/test/unit/cpu/test_opt.py \
            python/test/unit/cpu/test_cpu_annotations.py \
            python/test/unit/cpu/test_cpu_conversions.py \
            python/test/unit/cpu/test_cpu_flip.py \
            python/test/unit/cpu/test_cpu_subprocess.py \
            python/test/unit/language/test_annotations.py \
            python/test/unit/language/test_compile_errors.py \
            python/test/unit/language/test_conversions.py \
            python/test/unit/language/test_decorator.py \
            python/test/unit/language/test_pipeliner.py \
            python/test/unit/language/test_random.py \
            python/test/unit/language/test_standard.py \
            python/test/unit/runtime/test_autotuner.py \
            python/test/unit/runtime/test_bindings.py \
            python/test/unit/runtime/test_cache.py \
            python/test/unit/runtime/test_driver.py \
            python/test/unit/runtime/test_launch.py \
            python/test/unit/runtime/test_subproc.py \
            python/test/unit/test_debug_dump.py \
            --deselect python/test/unit/language/test_annotations.py::test_float_annotation \
            --deselect python/test/unit/language/test_compile_errors.py::test_fp8_support \
            --deselect python/test/unit/language/test_conversions.py::test_typeconvert_upcast \
            --deselect python/test/unit/language/test_conversions.py::test_typeconvert_downcast \
            --deselect python/test/unit/language/test_conversions.py::test_typeconvert_downcast_clamping \
            --deselect python/test/unit/language/test_standard.py::test_flip \
            --deselect python/test/unit/runtime/test_subproc.py::test_replenishing_process_pool_reuses_clean_processes \
            --deselect python/test/unit/runtime/test_driver.py::test_compile_warmup_only_intercepts_launches \
            --deselect python/test/unit/runtime/test_driver.py::test_compile_warmup_coordinator_deduplicates_and_propagates_errors \
            -k "not bfloat16"

      - name: Run python unit tests for Intel
        if: matrix.config.target-os == 'ubuntu'
        run: |
          python -m pytest -s -n 32 --device cpu \
            python/test/unit/language/test_core.py \
            python/test/unit/cpu/test_cpu_tensor_descriptor.py
          python -m pytest -s -n 32 --device cpu \
            python/test/unit/cpu/test_math.py \
            python/test/unit/cpu/test_opt.py \
            python/test/unit/cpu/test_cpu_annotations.py \
            python/test/unit/cpu/test_cpu_conversions.py \
            python/test/unit/cpu/test_cpu_features.py \
            python/test/unit/cpu/test_cpu_flip.py \
            python/test/unit/cpu/test_cpu_subprocess.py \
            python/test/unit/language/test_annotations.py \
            python/test/unit/language/test_compile_errors.py \
            python/test/unit/language/test_conversions.py \
            python/test/unit/language/test_decorator.py \
            python/test/unit/language/test_pipeliner.py \
            python/test/unit/language/test_random.py \
            python/test/unit/language/test_standard.py \
            python/test/unit/runtime/test_autotuner.py \
            python/test/unit/runtime/test_bindings.py \
            python/test/unit/runtime/test_cache.py \
            python/test/unit/runtime/test_driver.py \
            python/test/unit/runtime/test_launch.py \
            python/test/unit/runtime/test_subproc.py \
            python/test/unit/test_debug_dump.py \
            --deselect python/test/unit/language/test_annotations.py::test_float_annotation \
            --deselect python/test/unit/language/test_compile_errors.py::test_fp8_support \
            --deselect python/test/unit/language/test_conversions.py::test_typeconvert_upcast \
            --deselect python/test/unit/language/test_conversions.py::test_typeconvert_downcast \
            --deselect python/test/unit/language/test_conversions.py::test_typeconvert_downcast_clamping \
            --deselect python/test/unit/language/test_standard.py::test_flip \
            --deselect python/test/unit/runtime/test_subproc.py::test_replenishing_process_pool_reuses_clean_processes \
            --deselect python/test/unit/runtime/test_driver.py::test_compile_warmup_only_intercepts_launches

      - name: Run lit tests
        run: |
          LIT_TEST_DIR="build/$(ls build | grep -i cmake)/test"
          if [ ! -d "${LIT_TEST_DIR}" ]; then
            echo "Could not find '${LIT_TEST_DIR}'" ; exit -1
          fi
          lit -v "${LIT_TEST_DIR}/TritonCPU"

  build-with-optional-deps:
    name: Build with optional dependencies on GNR Intel x86(fp16, bf16, amx)
    runs-on:
      - granite-rapids
      - intel
      - x86
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python ${{ env.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}

      - name: Install pip and apt dependencies
        run: |
          echo "RUNNER_TARGET_OS: ${RUNNER_TARGET_OS}"
          python3 -m pip install --upgrade pip
          python3 -m pip install -r python/requirements.txt
          python3 -m pip install -r python/test-requirements.txt
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev g++
          pip install torch matplotlib

      - name: Install Ukernel XSMM
        id: ukernels-xsmm
        uses: ./.github/actions/checkout-install-ukernels
        with:
          lib_name: 'XSMM'

      - name: Install Ukernel OneDNN
        id: ukernels-onednn
        uses: ./.github/actions/checkout-install-ukernels
        with:
          lib_name: 'OneDNN'

      - name: Install Triton with Ukernels support
        env:
          XSMM_INSTALL: ${{ steps.ukernels-xsmm.outputs.path }}
          CMAKE_PREFIX_PATH: ${{ steps.ukernels-onednn.outputs.path }}
        run: |
          export XSMM_LIBRARY_DIRS=$XSMM_INSTALL/lib
          export XSMM_INCLUDE_DIRS=$XSMM_INSTALL/include
          echo "CMAKE_PREFIX_PATH is '$CMAKE_PREFIX_PATH'"
          echo "XSMM_INSTALL is '$XSMM_INSTALL'"
          echo "XSMM_INCLUDE_DIRS is '$XSMM_INCLUDE_DIRS'"
          python3 -m pip install --no-build-isolation -vvv -e '.[tests]'

      - name: AMX/FMA Run python unit tests on GNR
        env:
          TRITON_CPU_UKERNELS_LIB: "None"
        run: |
          python -m pytest -s -n 32 --device cpu python/test/unit/language/test_core.py
          DTYPE=bfloat16 python  python/tutorials/cpu/04-blocked-matmul.py
          DTYPE=float32 python  python/tutorials/cpu/04-blocked-matmul.py
          DTYPE=float16 python  python/tutorials/cpu/04-blocked-matmul.py

          export TRITON_ALWAYS_COMPILE=1 \
                 TRITON_CPU_UNROLL_AND_REORDER_ELEMENTWISE_OPS=1 \
                 TRITON_LLVM_DEBUG_ONLY=triton-cpu-dot-conversion,triton-cpu-unroll-and-reorder-elementwise-ops
          python python/tutorials/cpu/08-sfc-matmul.py --dtype bfloat16 --target amx
          python python/tutorials/cpu/08-sfc-matmul.py --dtype int8     --target amx
          python python/tutorials/cpu/08-sfc-matmul.py --dtype bfloat16 --target avx512
          unset TRITON_ALWAYS_COMPILE TRITON_CPU_UNROLL_AND_REORDER_ELEMENTWISE_OPS TRITON_LLVM_DEBUG_ONLY

      - name: OneDNN Run python unit tests on GNR
        env:
          TRITON_CPU_UKERNELS_LIB: "OneDNN"
        run: |
          python -m pytest -s -n 32 --device cpu python/test/unit/language/test_core.py
          DTYPE=bfloat16 python  python/tutorials/cpu/04-blocked-matmul.py
          DTYPE=float32 python  python/tutorials/cpu/04-blocked-matmul.py
          DTYPE=float16 python  python/tutorials/cpu/04-blocked-matmul.py

      - name: XSMM Run python unit tests on GNR
        env:
          TRITON_CPU_UKERNELS_LIB: "XSMM"
        run: |
          python -m pytest -s -n 32 --device cpu python/test/unit/language/test_core.py
          DTYPE=bfloat16 python  python/tutorials/cpu/04-blocked-matmul.py
          DTYPE=float32 python  python/tutorials/cpu/04-blocked-matmul.py
          DTYPE=float16 python  python/tutorials/cpu/04-blocked-matmul.py
